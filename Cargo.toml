[package]
name = "cargo-trustpub"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "How was each dependency in Cargo.lock published? Trusted Publishing or a token, and which crates went back to a token after using Trusted Publishing"
repository = "https://github.com/Urthella/cargo-trustpub"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
